name: android

on:
  push:
    branches: [main]
    paths: ["app/**", "tests/fixtures/**", "data/seeds/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", "tests/fixtures/**", "data/seeds/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: SDK platform
        run: sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (pure JVM)
        run: ./gradlew :core:test
      - name: App unit tests, lint, debug APK, instrumented test APK
        run: ./gradlew :android:testDebugUnitTest :android:lintDebug :android:assembleDebug :android:assembleDebugAndroidTest
